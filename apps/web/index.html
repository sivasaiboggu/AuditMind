<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="preload" as="font" type="font/woff2" crossorigin href="../../node_modules/@fontsource-variable/source-serif-4/files/source-serif-4-latin-wght-normal.woff2" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary Meta -->
    <title>AuditMind — Contract Risk Review</title>
    <meta name="description" content="Upload a contract, review clause risk scores with plain-English explanations and suggested revisions, and ask questions about the document. Outputs need legal review." />
    <meta name="keywords" content="contract analysis, legal review, risk assessment, NDA review, compliance, contract auditing" />
    <meta name="author" content="AuditMind" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph / Social -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="AuditMind — Contract Risk Review" />
    <meta property="og:description" content="Upload a contract and review clause risk scores, explanations and suggested revisions. Outputs need legal review." />
    <meta property="og:image" content="https://auditmind.vercel.app/review-preview.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="An AuditMind sample contract finding with the matched wording underlined." />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="AuditMind — Contract Risk Review" />
    <meta name="twitter:description" content="Upload a contract and review clause risk scores, explanations and suggested revisions. Outputs need legal review." />

    <meta name="twitter:image" content="https://auditmind.vercel.app/review-preview.png" />

    <!-- Theme -->
    <meta name="theme-color" content="#161c27" />
    <meta name="color-scheme" content="light dark" />

    <!-- Apply the saved (or OS-preferred) theme before first paint to avoid a flash -->
    <script>
      try {
        var storedTheme = localStorage.getItem('auditmind-theme');
        var isDark = storedTheme
          ? storedTheme === 'dark'
          : !window.matchMedia || !window.matchMedia('(prefers-color-scheme: light)').matches;
        document.documentElement.classList.toggle('dark', isDark);
      } catch (e) {
        document.documentElement.classList.add('dark');
      }
    </script>

  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
