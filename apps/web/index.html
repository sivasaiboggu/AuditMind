<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary Meta -->
    <title>AuditMind — AI Contract Risk & Compliance Analyzer</title>
    <meta name="description" content="AuditMind uses AI to instantly analyze legal contracts, identify risk clauses, suggest amendments, and answer questions about your agreements." />
    <meta name="keywords" content="contract analysis, AI legal review, risk assessment, NDA review, compliance, contract auditing" />
    <meta name="author" content="AuditMind" />

    <!-- Open Graph / Social -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="AuditMind — AI Contract Risk Analyzer" />
    <meta property="og:description" content="Enterprise-grade AI that reads, analyzes, and flags risky clauses in your legal contracts in seconds." />
    <!-- No og:image: the file it used to point at was never in the repo,
         so social shares got a 404. Add a real 1200x630 asset before
         re-adding this tag. -->

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="AuditMind — AI Contract Risk Analyzer" />
    <meta name="twitter:description" content="Enterprise-grade AI that reads, analyzes, and flags risky clauses in your legal contracts in seconds." />

    <!-- Theme -->
    <meta name="theme-color" content="#111111" />
    <meta name="color-scheme" content="light dark" />

    <!-- Apply the saved (or OS-preferred) theme before first paint to avoid a flash -->
    <script>
      try {
        var storedTheme = localStorage.getItem('auditmind-theme');
        var isDark = storedTheme
          ? storedTheme === 'dark'
          : !window.matchMedia || !window.matchMedia('(prefers-color-scheme: light)').matches;
        document.documentElement.classList.toggle('dark', isDark);
      } catch (e) {
        document.documentElement.classList.add('dark');
      }
    </script>

    <!-- Preconnect for performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
